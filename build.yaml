# Jellyfin plugin build manifest (jprm / jellyfin-plugin-repo convention).
#
# This file is the source of truth for the public repo's release automation
# (.github/workflows/release.yml, present only in the public repo split - see
# docs/jellyfin-arr-profile-switcher-deployment.md), which packages a tagged
# commit with jprm and publishes it as a GitHub Release + manifest.json entry.
#
# This private monorepo's own copy of the plugin is unaffected by that: it's
# still built locally and installed by Ansible from a committed dist/
# artifact, same pattern as src/jellyfin-loudness-normalizer/build.yaml - no
# CI runs against this path here, and dist/ is not what the public release
# artifact is built from.
#
# Keep `version` in sync with Directory.Build.props and meta.json.
name: "Arr Profile Switcher"
guid: "6556f718-0762-48ec-bc64-bac5b86ed0c6"
version: "1.0.0.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "sdvaletone"
overview: "Radarr/Sonarr quality-profile switcher for Jellyfin Web."
description: >
  Profile-switch menu item on the item detail page and three-dot menu,
  scoped to movies and series. Options are admin-curated per Radarr/Sonarr
  instance; switching resolves the item, applies the profile, and triggers
  a search server-side. API keys stay server-side.
category: "General"
artifacts:
  - "Jellyfin.Plugin.ArrProfileSwitcher.dll"
changelog: >
  1.0.0.0 - Admin-curated profile-option mapping. GET /ArrProfileSwitcher/Status,
  POST /ArrProfileSwitcher/Upgrade. File Transformation client-script injection
  (menu + detail button). Per-user item-visibility check on Status/Upgrade,
  atomic upgrade-cooldown, safe parsing of Radarr/Sonarr responses, HTTP
  client timeout, no hardcoded Radarr/Sonarr URL defaults. TV seasons are now
  also switchable (resolves to the parent series, sharing its cooldown), not
  just the series itself. Fixed the detail-page picker button going stale
  (wrong item, or an unrefreshed label) after Jellyfin's SPA restores a
  cached page instance or after a same-item switch; full profile names no
  longer get truncated under the button's icon. Fixed the admin config
  page's profile-mapping table: the checkbox/profile-name column was
  stretching to the full row width (Jellyfin's own .emby-checkbox-label
  CSS defaults to width:100%), pushing each row's label input completely
  outside the row instead of forming a proper two-column table.
